name: Opus extension

# The client needs a native Opus decoder, because Godot has none of its own.
# The extension is built from pinned sources on every platform the game is
# played on, and the decoder is checked against the audio the server's own
# decoder produces, so a broken build is caught here rather than on a
# player's machine.

on:
  push:
    paths:
      - "code/client/native/opus/**"
      - "code/client/tests/opus_extension_check.gd"
      - "code/client/tests/opus_data/**"
      - ".github/workflows/opus-extension.yml"
  pull_request:
    paths:
      - "code/client/native/opus/**"
      - "code/client/tests/opus_extension_check.gd"
      - "code/client/tests/opus_data/**"
      - ".github/workflows/opus-extension.yml"
  workflow_dispatch:

jobs:
  extension:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            godot: win64
            godot_file: Godot_v4.6.2-stable_win64.exe
            godot_zip: Godot_v4.6.2-stable_win64.exe.zip
          - name: macOS arm64
            os: macos-14
            godot: macos
            godot_file: Godot_v4.6.2-stable_macos.universal
            godot_zip: Godot_v4.6.2-stable_macos.universal.zip
          - name: macOS x64
            os: macos-13
            godot: macos
            godot_file: Godot_v4.6.2-stable_macos.universal
            godot_zip: Godot_v4.6.2-stable_macos.universal.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: python -m pip install --upgrade cmake ninja

      - name: Put the Visual Studio tools in the environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the extension
        shell: bash
        working-directory: code/client/native/opus
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -ExecutionPolicy Bypass -File build.ps1
          else
            chmod +x build.sh
            ./build.sh
          fi

      - name: Download Godot
        shell: bash
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/${{ matrix.godot_zip }}"
          unzip -q godot.zip
          ls -la

      - name: Import the project
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            GODOT="./${{ matrix.godot_file }}"
          else
            GODOT="./${{ matrix.godot_file }}.app/Contents/MacOS/${{ matrix.godot_file }}"
            chmod +x "$GODOT"
          fi
          timeout 300 "$GODOT" --headless --path code/client --import || true

      - name: Check the decoder
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            GODOT="./${{ matrix.godot_file }}"
          else
            GODOT="./${{ matrix.godot_file }}.app/Contents/MacOS/${{ matrix.godot_file }}"
            chmod +x "$GODOT"
          fi
          "$GODOT" --headless --path code/client --script res://tests/opus_extension_check.gd

      - name: Upload the libraries
        uses: actions/upload-artifact@v4
        with:
          name: opus-extension-${{ matrix.os }}-${{ matrix.godot }}
          path: code/client/native/opus/bin/
          if-no-files-found: error
