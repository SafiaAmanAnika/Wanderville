[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    postgres: requires a dedicated PostgreSQL test database
    slow: exceeds the default per-test timeout
    preserve_rows: test manages its own database rows over HTTP; skip the
        per-test table wipe (used by the real-process Godot suites, which sign up
        against a rate limit)
# Every test is bounded. A test that starts real processes used to be able to hang
# a whole session, so the limit is deliberately tight and raised only where a
# reproducible measurement demands it.
#
# --timeout-method=thread is used deliberately: signal is not supported on
# Windows. It can terminate pytest without running fixture teardown, so process
# cleanup does NOT rely on this. conftest registers every spawned PID in a
# registry and an autouse fixture kills them, and an external watchdog
# (tests/integration/watchdog.py) covers the case where pytest itself is killed.
timeout = 120
timeout_method = thread