<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="800" viewBox="0 0 1130 800"><rect width="1130" height="800" fill="#fff8e9"/><text x="30" y="32" font-family="Arial" font-size="22" fill="#722f40">Plant a crop / sequence</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#722f40"/></marker></defs>
