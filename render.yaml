# Ongoing free hobby service. External Neon PostgreSQL required.
# Mail goes out over Google's HTTPS API, so no purchased domain is needed and
# Render Free's SMTP block does not apply. Sleeps after inactivity;
# see docs/SETUP_AND_HOSTING.md for quotas and setup.
services:
  - type: web
    name: wanderville-api
    runtime: python
    plan: free
    region: singapore
    rootDir: code/server
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m app.db.seed && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --ws-max-size 65536 --ws-max-queue 8 --no-access-log
    # Routine probes must not wake the serverless database.
    # Use /ready manually after deployment to verify schema and seeding.
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: WANDERVILLE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: EMAIL_DELIVERY
        value: gmail_api
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VOICE_ENABLED
        value: "true"
      - key: VOICE_ROOM_LIMIT
        value: "8"
      - key: VOICE_TOTAL_LIMIT
        value: "32"
      - key: PROXIMITY_RADIUS
        value: "600"
      - key: PROXIMITY_EXIT_RADIUS
        value: "720"
      # Keep Neon idle when nobody is playing; run maintenance explicitly.
      - key: WORLD_WORKER_ENABLED
        value: "false"
