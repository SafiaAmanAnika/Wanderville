# Ongoing free hobby service. External Neon PostgreSQL and Brevo accounts required.
# Sleeps after inactivity; see docs/SETUP_AND_HOSTING.md for quotas and setup.
services:
  - type: web
    name: wanderville-api
    runtime: python
    plan: free
    region: singapore
    rootDir: code/server
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m app.db.seed && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: WANDERVILLE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: EMAIL_DELIVERY
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WORLD_WORKER_ENABLED
        value: "true"
